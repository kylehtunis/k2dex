<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages: redirect to index with the original
      // path encoded as a query parameter. The app reads it on load and
      // replaces the URL via the router.
      var base = "/k2dex-science";
      var path = location.pathname;
      if (path.startsWith(base)) path = path.slice(base.length) || "/";
      location.replace(base + "/?route=" + encodeURIComponent(path) + location.hash);
    </script>
  </head>
  <body></body>
</html>
