[project]
name = "k2dex"
version = "0.1.0"
description = "Complexity-science methods on VGC team-composition data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "networkx>=3.4",
    "matplotlib>=3.10",
    "jupyterlab>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
